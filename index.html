    <!-- Hero LCP preload — the homepage Hero is the largest-contentful element.
         It is a seasonal SPA component (summer/winter) rendered only after React
         mounts, so inject a responsive <link rel=preload imagesrcset> here in
         <head> to fetch the correct AVIF variant (mobile → 800px ~33KB) before
         the JS bundle parses. -->
    <script>
      (function () {
        var summer = (function () { var m = new Date().getMonth() + 1; return m >= 5 && m <= 9; })();
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.type = 'image/avif';
        l.setAttribute('fetchpriority', 'high');
        l.imageSizes = '100vw';
        l.imageSrcset = summer
          ? '/images/hero-summer-800.avif 800w, /images/hero-summer-1200.avif 1200w'
          : '/images/hero-800.avif 800w, /images/hero-1200.avif 1200w, /images/hero.avif 1920w';
        document.head.appendChild(l);
      })();
    </script>
